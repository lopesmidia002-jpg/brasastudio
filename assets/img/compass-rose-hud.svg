<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Luminescência e glow âmbar sutil característico de HUD sci-fi -->
    <radialGradient id="hud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbf47" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d99426" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#b07010" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b07010" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente dourado-âmbar nobre de alta precisão para a estrela -->
    <linearGradient id="hud-star-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fedc82"/>
      <stop offset="35%" stop-color="#e0aa3a"/>
      <stop offset="70%" stop-color="#bf8322"/>
      <stop offset="100%" stop-color="#945d0e"/>
    </linearGradient>

    <!-- Filtro de brilho sutil para luminescência técnica -->
    <filter id="hud-star-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo preto sólido -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- Halo de luminescência âmbar suave central -->
  <circle cx="100" cy="100" r="48" fill="url(#hud-glow)"/>

  <!-- Marcações Técnicas / Retículo HUD Sci-fi -->
  <!-- 1. Anel interno concêntrico pontilhado -->
  <circle cx="100" cy="100" r="32" stroke="#c59b47" stroke-width="1" stroke-dasharray="2.5, 3.5" opacity="0.6"/>

  <!-- 2. Círculo intermediário contínuo fino (tangente às pontas da estrela) -->
  <circle cx="100" cy="100" r="58" stroke="#c59b47" stroke-width="1.2" opacity="0.85"/>

  <!-- 3. Anel concêntrico externo pontilhado -->
  <circle cx="100" cy="100" r="76" stroke="#c59b47" stroke-width="1.1" stroke-dasharray="3, 4" opacity="0.75"/>

  <!-- 4. Eixos ortogonais longos cruzados (vertical e horizontal) -->
  <line x1="100" y1="8" x2="100" y2="192" stroke="#c59b47" stroke-width="1.2" opacity="0.9"/>
  <line x1="8" y1="100" x2="192" y2="100" stroke="#c59b47" stroke-width="1.2" opacity="0.9"/>

  <!-- 5. Linhas diagonais de referência técnica a 45 graus -->
  <line x1="38" y1="38" x2="162" y2="162" stroke="#c59b47" stroke-width="0.95" opacity="0.55"/>
  <line x1="38" y1="162" x2="162" y2="38" stroke="#c59b47" stroke-width="0.95" opacity="0.55"/>

  <!-- 6. Estrela sólida de quatro pontas com bordas côncavas perfeitas em gradiente âmbar -->
  <path d="M 100,42 Q 100,100 158,100 Q 100,100 100,158 Q 100,100 42,100 Q 100,100 100,42 Z" fill="url(#hud-star-gradient)" filter="url(#hud-star-filter)"/>
  <path d="M 100,42 Q 100,100 158,100 Q 100,100 100,158 Q 100,100 42,100 Q 100,100 100,42 Z" fill="url(#hud-star-gradient)"/>
</svg>
