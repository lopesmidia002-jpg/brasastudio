services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brasa-studio-landing
    ports:
      - "3000:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    environment:
      - NGINX_PORT=80
